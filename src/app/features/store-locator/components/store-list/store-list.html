<section class="store-list" aria-labelledby="store-list-title">
  <h2 class="store-list__title" id="store-list-title">Stores</h2>

  @if (stores().length === 0) {
    @if (emptyMessage()) {
      <p class="store-list__empty">{{ emptyMessage() }}</p>
    }
  } @else {
    <ul class="store-list__items" aria-label="Stores in Spain">
      @for (store of stores(); track store.id) {
        @if (isValidCoordinates(store.latitude, store.longitude)) {
          @let address = storeAddresses.getAddress(store) | async;
          <li class="store-list__item">
            <button
              class="store-list__button"
              [class.store-list__button--selected]="store.id === selectedStoreId()"
              [attr.aria-pressed]="store.id === selectedStoreId()"
              [attr.data-store-id]="store.id"
              type="button"
              (click)="selectStore(store)"
            >
              <span class="store-list__name">{{ store.name }}</span>
              <span class="store-list__location">
                @if (address && address !== 'Address unavailable') {
                  {{ address }}
                } @else {
                  Coordinates: {{ store.latitude }}, {{ store.longitude }}
                }
              </span>
            </button>
          </li>
        }
      }
    </ul>
  }
</section>
